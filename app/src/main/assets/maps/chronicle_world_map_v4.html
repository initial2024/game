<style>

*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:"STKaiti","Kaiti SC",KaiTi,"Noto Serif CJK SC","Songti SC",serif;color:var(--text);background:radial-gradient(ellipse at 50% 44%,var(--bg1),var(--bg2));-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#map{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}

#mast{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(var(--safe-top) + 12px);writing-mode:vertical-rl;font-weight:700;font-size:28px;line-height:1.12;letter-spacing:.13em;pointer-events:none;text-shadow:0 1px 5px var(--bg1)}
#mast small{display:block;font-size:12px;letter-spacing:.08em;font-weight:400;margin-right:8px;opacity:.85}
#mast i{display:block;writing-mode:horizontal-tb;background:#a72e29;color:#ffecc6;padding:6px 4px;margin:12px 0 0 auto;font:700 13px serif;border-radius:3px}
#compass{position:absolute;left:12px;top:calc(var(--safe-top) + 10px);width:46px;height:46px;pointer-events:none;color:var(--text);filter:drop-shadow(0 1px 2px rgba(0,0,0,.15))}
#compass-needle{transform-origin:center;transition:transform .08s linear}
#admin-open,#scene-open{position:absolute;left:12px;z-index:7;height:38px;min-width:74px;padding:0 9px;font:600 12px system-ui;background:var(--panel)}
#admin-open{top:calc(var(--safe-top) + 66px)}
#scene-open{top:calc(var(--safe-top) + 111px)}
#territory-open{position:absolute;left:12px;top:calc(var(--safe-top) + 156px);z-index:7;height:38px;min-width:74px;padding:0 9px;font:600 12px system-ui;background:var(--panel)}
#panel input[type=text],#panel textarea,#panel select{width:100%;min-height:42px;padding:9px;border:1px solid var(--edge);border-radius:8px;background:var(--bg1);color:var(--text);font:14px system-ui}
#panel textarea{min-height:120px;resize:vertical;font:12px/1.5 monospace}
#panel .form-line{display:grid;grid-template-columns:1fr 1fr;gap:7px}
#panel .caption{font-size:12px;color:var(--sub);margin:3px 0 5px}
#panel button.danger{color:var(--accent)}
#mast i[hidden]{display:none}
#draw-controls{position:absolute;z-index:14;left:12px;right:12px;top:calc(var(--safe-top) + 208px);padding:9px;border:1px solid var(--edge);border-radius:10px;background:var(--panel);font:12px system-ui;box-shadow:0 4px 16px #0003}
#draw-controls .actions{display:flex;gap:6px;margin-top:7px}#draw-controls button{flex:1}

#panel .district{padding:10px;border:1px solid var(--edge);border-radius:9px;margin:9px 0;background:color-mix(in srgb,var(--panel) 82%,var(--bg1))}
#panel .district summary{cursor:pointer;font-weight:700;padding:3px 0;line-height:1.6}
#panel .district .result-list{margin-top:9px}
#panel .seg{display:flex;gap:7px;margin:0 0 9px}
#panel .seg button{flex:1;padding:7px 3px}
#panel .seg button[aria-pressed=true]{background:var(--text);color:var(--panel)}
#panel .crumb{padding:8px;border-radius:7px;background:var(--bg1);font-size:12px;margin:5px 0 9px}
#panel .notice-area{font-size:12px;line-height:1.55;color:var(--sub);margin:4px 0 9px}
#panel button.listing{min-height:42px}

#panel{position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(var(--safe-bottom) + 62px);max-height:min(52vh,480px);z-index:9;background:var(--panel);border:1px solid var(--edge);border-radius:13px;box-shadow:0 10px 30px rgba(0,0,0,.19);overflow:auto;overscroll-behavior:contain;padding:14px;font-family:system-ui,"Noto Sans CJK SC",sans-serif;font-size:13px;line-height:1.5}

#panel .muted{color:var(--sub);font-size:12px}

#panel .actions{display:flex;gap:8px;margin-top:11px}

function addDraftPoint(sx,sy){if(!territoryDraft)return;const xy=customGeography()?inverse(sx,sy,base):inverseSurface(sx,sy);if(!xy)return;const ll=unproject(...xy);if(!ll.every(Number.isFinite)||ll[0]<55||ll[0]>155||ll[1]<-4||ll[1]>65){alert('超出当前投影可编辑范围');return}if(territoryDraft.polygon.length>=60){alert('单个疆域最多 60 个顶点');return}territoryDraft.polygon.push(ll.map(v=>Math.round(v*10000)/10000));updateDraftCount()}
function drawDraft(){if(!territoryDraft?.polygon.length)return;const pts=projectedPolygon(territoryDraft.polygon);ctx.save();ctx.beginPath();pts.forEach((p,i)=>{const s=screen(p[0],p[1],customGeography()?base:elevation(...p)+8);if(i)ctx.lineTo(s[0],s[1]);else ctx.moveTo(s[0],s[1]);ctx.fillStyle=colors.region;ctx.fillRect(s[0]-3,s[1]-3,6,6)});ctx.strokeStyle=colors.region;ctx.lineWidth=2;ctx.stroke();ctx.restore()}
function cancelDraw(){territoryDraft=null;el('draw-controls').hidden=true;request()}
el('draw-undo').onclick=()=>{if(territoryDraft?.polygon.length)territoryDraft.polygon.pop();updateDraftCount()};el('draw-cancel').onclick=cancelDraw;
el('draw-finish').onclick=()=>{if(!territoryDraft)return;try{const t={id:territoryDraft.id,name:'',polityId:'',status:'neutral',polygon:territoryDraft.polygon};patchScene({territories:[...scene.territories,t]});cancelDraw();showTerritories()}catch(e){alert('疆域尚未保存：'+e.message)}};
function territoryAt(sx,sy){if(!layers.territories)return null;const pos=customGeography()?inverse(sx,sy,base):inverseSurface(sx,sy);if(!pos)return null;return [...scene.territories].reverse().find(t=>inside(pos[0],pos[1],projectedPolygon(t.polygon)))||null}
function focusTerritory(t){const ring=projectedPolygon(t.polygon),x=ring.reduce((s,p)=>s+p[0],0)/ring.length,y=ring.reduce((s,p)=>s+p[1],0)/ring.length,z=customGeography()?base:elevation(x,y);cam.zoom=3;setCamera();cam.ox=0;cam.oy=0;const p=screen(x,y,z);cam.ox=W/2-p[0];cam.oy=H*.41-p[1];clamp();request()}
function territoryDetails(t){window.dispatchEvent(new CustomEvent("chronicle-map:territory-select",{detail:{sceneId:scene.id,territoryId:t.id}}));const children=[txt('p',t.description||'由当前剧情提供的疆域几何。多边形仅用于可视化，不保证测绘精度。','notice-area'),txt('p',`稳定 ID：${t.id}`),txt('p',`当前归属：${ownership(t.polityId)||'无归属'}`),txt('p',`争议状态：${({controlled:'稳定控制',contested:'争议',neutral:'无主'})[t.status]}`)];
 const b=txt('button','定位此疆域');b.onclick=()=>{focusTerritory(t);panel.hidden=true;openPanel=''};children.push(b);setPanel({type:'territoryDetail',title:t.name||'未命名疆域',children});
 window.dispatchEvent(new CustomEvent('chronicle-map:territory-select',{detail:{sceneId:scene.id,territoryId:t.id}}))}
function exampleWorld(){return {schema:UI_SCHEMA,id:'demo-fiction',revision:0,meta:{title:'虚构演示世界',era:'虚构历法 · 仅用于测试',seal:''},polities:[{id:'a',name:'玄岚',color:'#b75d45'},{id:'b',name:'临川',color:'#5a90a0'},{id:'c',name:'北辰',color:'#9b8657'}],places:{'place-0':{name:'月京',polityId:'a'},'place-1':{name:'河都',polityId:'b'}},placeStates:{'town-new':{status:'planned'},'town-old':{status:'ruined'}},extraPlaces:[{id:'town-new',lon:108.5,lat:30.5,type:'s'},{id:'town-old',lon:116.5,lat:32,type:'x'}],territories:[{id:'region-a',name:'苍岭原',polityId:'a',polygon:[[99,30],[106,28],[112,29],[115,35],[109,39],[102,37]],status:'controlled'},{id:'region-b',name:'河湾平野',polityId:'b',polygon:[[112,28],[121,29],[124,33],[118,37],[115,35]],status:'contested'},{id:'region-c',name:'北部山原',polityId:'c',polygon:[[104,40],[114,39],[119,43],[112,48],[105,46]],status:'controlled'}],groups:[{id:'region-a',name:'苍岭原',rank:'郡',polityId:'a',memberIds:['place-0','town-new']},{id:'region-b',name:'河湾平野',rank:'行省',polityId:'b',memberIds:['place-1','town-old']}],routes:[{id:'road-a',fromId:'place-0',toId:'town-new',kind:'road',status:'open'}]}}
function applyWorldDelta(delta){
 if(!delta||typeof delta!=='object'||Array.isArray(delta))throw Error('增量消息无效');
 if(delta.sceneId!==scene.id)throw Error('增量场景 ID 不匹配');
 if(!Number.isSafeInteger(delta.revision)||delta.revision<=scene.revision)throw Error('版本过期、乱序或重放');
 const allowed=new Set(['meta','places','placeStates','territories','routes','groups','polities','extraPlaces','geography']);
 const changes=delta.changes;if(!changes||typeof changes!=='object'||Array.isArray(changes)||Object.keys(changes).some(k=>!allowed.has(k)))throw Error('增量包含不支持的字段');
 const result=patchScene({...changes,revision:delta.revision},true);
 window.dispatchEvent(new CustomEvent('chronicle-map:world-updated',{detail:{sceneId:scene.id,revision:scene.revision}}));return result
}
function togglePanel(type){if(openPanel===type&&!panel.hidden){panel.hidden=true;openPanel='';request()}else if(type==='search')showSearch();else if(type==='layers')showLayers();else if(type==='admin')showAdmin();else if(type==='scene')showScene();else if(type==='territory')showTerritories()}
let pointers=new Map(),gesture=null,down=null,lastTouch=0;
const pos=e=>[e.clientX,e.clientY];
function gestureInfo(){const a=[...pointers.values()];if(a.length<2)return null;return{distance:Math.max(1,Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])),angle:Math.atan2(a[1][1]-a[0][1],a[1][0]-a[0][0]),center:[(a[0][0]+a[1][0])/2,(a[0][1]+a[1][1])/2]}}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,pos(e));if(pointers.size===1){down={p:pos(e),time:performance.now(),moved:false};gesture=null}else if(pointers.size===2){gesture=gestureInfo();down=null}});
canvas.addEventListener('pointermove',e=>{const old=pointers.get(e.pointerId);if(!old)return;const now=pos(e);pointers.set(e.pointerId,now);if(pointers.size===1){const dx=now[0]-old[0],dy=now[1]-old[1];if(down&&Math.hypot(now[0]-down.p[0],now[1]-down.p[1])>7)down.moved=true;if(down?.moved){if(mode==='rotate'){cam.yaw+=dx*.32;cam.pitch-=dy*.25}else{cam.ox+=dx;cam.oy+=dy}clamp();request()}}
else if(pointers.size===2){const next=gestureInfo();if(gesture){const f=next.distance/gesture.distance;zoomAt(f,gesture.center[0],gesture.center[1]);cam.ox+=next.center[0]-gesture.center[0];cam.oy+=next.center[1]-gesture.center[1];const dAngle=Math.atan2(Math.sin(next.angle-gesture.angle),Math.cos(next.angle-gesture.angle));if(Math.abs(dAngle)<.6)cam.yaw+=dAngle/D*.55;clamp();request()}gesture=next}});
function pointerEnd(e){const was=pointers.size,pt=pointers.get(e.pointerId);pointers.delete(e.pointerId);if(was===1&&pt&&down&&!down.moved&&performance.now()-down.time<450&&territoryDraft){addDraftPoint(pt[0],pt[1])}else if(was===1&&pt&&down&&!down.moved&&performance.now()-down.time<450){const elapsed=performance.now()-lastTouch;lastTouch=performance.now();if(elapsed<340){zoomAt(1.6,pt[0],pt[1]);down=null}else{const found=hitBoxes.filter(a=>Math.hypot(a.x-pt[0],a.y-pt[1])<=a.r).sort((a,b)=>Math.hypot(a.x-pt[0],a.y-pt[1])-Math.hypot(b.x-pt[0],b.y-pt[1]))[0];if(found){details(found.p)}else{const t=territoryAt(pt[0],pt[1]);if(t)territoryDetails(t)}}}if(pointers.size===1){const rest=[...pointers.values()][0];down={p:rest,time:performance.now(),moved:true}}else down=null;gesture=pointers.size>=2?gestureInfo():null}
canvas.addEventListener('pointerup',pointerEnd);canvas.addEventListener('pointercancel',pointerEnd);canvas.addEventListener('lostpointercapture',e=>{if(pointers.has(e.pointerId))pointerEnd(e)});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*.0014),e.clientX,e.clientY)},{passive:false});
canvas.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','+','-','0'].includes(e.key)){e.preventDefault();if(e.key==='ArrowUp')cam.oy+=30;if(e.key==='ArrowDown')cam.oy-=30;if(e.key==='ArrowLeft')cam.ox+=30;if(e.key==='ArrowRight')cam.ox-=30;if(e.key==='+')zoomAt(1.18,W/2,H/2);if(e.key==='-')zoomAt(.85,W/2,H/2);if(e.key==='0')Object.assign(cam,{yaw:0,pitch:34,zoom:1.8,ox:0,oy:0});clamp();request()}});
el('mode').onclick=()=>{mode=mode==='rotate'?'pan':'rotate';el('mode').textContent=mode==='rotate'?'旋转':'平移'};
el('reset').onclick=()=>{Object.assign(cam,{yaw:0,pitch:34,zoom:1.8,ox:0,oy:0});selected=null;request()};
el('theme').onclick=()=>{themeName=themeName==='classic'?'night':themeName==='night'?'eye':'classic';colors=palettes[themeName];document.documentElement.dataset.theme=themeName;document.querySelector('meta[name="theme-color"]').content=getComputedStyle(document.documentElement).getPropertyValue('--bg1').trim();request()};
el('font').onclick=()=>{fontScale=fontScale===1?1.2:fontScale===1.2?1.4:1;request()};
el('layers').onclick=()=>togglePanel('layers');el('search').onclick=()=>togglePanel('search');el('admin-open').onclick=()=>togglePanel('admin');el('scene-open').onclick=()=>togglePanel('scene');el('territory-open').onclick=()=>togglePanel('territory');
window.addEventListener('resize',fit);document.addEventListener('visibilitychange',()=>{if(!document.hidden)request()});

window.ChronicleMap=Object.freeze({
 applyScenario:data=>applyScene(data),patchScenario:patch=>patchScene(patch),applyWorldDelta:delta=>applyWorldDelta(delta),loadDemo:()=>{if(nativeReadOnly)throw Error("只读地图");return applyScene(exampleWorld())},getSchema:()=>UI_SCHEMA,getCapabilities:()=>({schema:UI_SCHEMA,projection:'Albers 25/47 105E',geographicEnvelope:{lon:[55,155],lat:[-4,65]},topology:'polygons-without-holes',historicalBoundariesVerified:false,gameStateAuthority:false}),listTerritories:()=>JSON.parse(JSON.stringify(scene.territories)),listRoutes:()=>JSON.parse(JSON.stringify(scene.routes)),listScenarioSlots:()=>savedScenes(),createScenario:()=>createNewScene(),selectScenario:id=>{if(!sceneLibrary[id])throw Error('未找到剧情槽位');return applyScene(sceneLibrary[id])},
 clearScenario:()=>clearScene(),exportScenario:()=>plainScene(),
 listPlaces:()=>names.filter(p=>relevantCity(p)&&'dcsfhxop'.includes(p.type)).map(p=>({id:p.id,lon:p.lon,lat:p.lat,type:p.type,name:displayPlace(p)||null,status:cityStatus(p)})),
 listGroups:()=>activeGroups().map(g=>({id:g.id,name:displayGroup(g),memberIds:g.memberIds||g.counties||g.places||[]}))
});
try{
 if(storedSnapshot){const data=JSON.parse(storedSnapshot);if(data&&Array.isArray(data.scenes)){
   for(const item of data.scenes.slice(0,30)){try{const entry=validateScene(item);sceneLibrary[entry.id]=entry}catch{}}
   if(sceneLibrary[data.activeId])applyScene(sceneLibrary[data.activeId],false)
 }}else{
  const legacy=nativeReadOnly?null:localStorage.getItem(LEGACY_KEY);
  if(legacy)applyScene(JSON.parse(legacy),true)
 }
}catch(e){console.warn('剧情槽位缓存异常，使用空白底图',e)}
if(!sceneLibrary[scene.id])sceneLibrary[scene.id]=plainScene();
window.addEventListener('chronicle-map:place-select',e=>hostMessage('place-select',e.detail));

// Camera/theme cache is auxiliary only; native world snapshots never read it as game data.
function saveView(){try{localStorage.setItem('chronicle-map-view-'+scene.id,JSON.stringify({cam,themeName,fontScale,layers}))}catch{}}
function restoreView(){try{const v=JSON.parse(localStorage.getItem('chronicle-map-view-'+scene.id)||'null');if(!v)return;if(v.cam&&Object.values(v.cam).every(Number.isFinite))Object.assign(cam,v.cam);if(palettes[v.themeName]){themeName=v.themeName;colors=palettes[themeName];document.documentElement.dataset.theme=themeName}if([1,1.2,1.4].includes(v.fontScale))fontScale=v.fontScale;if(v.layers)for(const k in layers)if(typeof v.layers[k]==='boolean')layers[k]=v.layers[k];clamp();request()}catch{}}
canvas.addEventListener('pointerup',saveView);canvas.addEventListener('wheel',saveView);canvas.addEventListener('keydown',saveView);
el('theme').addEventListener('click',saveView);el('font').addEventListener('click',saveView);el('reset').addEventListener('click',saveView);
panel.addEventListener('change',saveView);document.addEventListener('visibilitychange',saveView);
window.addEventListener('chronicle-map:native-scene',restoreView);
refreshSceneHeader();fit();hostMessage('ready');
