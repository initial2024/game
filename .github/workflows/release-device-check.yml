name: Optimized APK device recheck
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Existing CI run containing paired optimized APKs
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: release-smoke-report-and-mapping
          run-id: ${{ inputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ci-artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -feature -Vulkan
          script: |
            adb shell wm size 390x844
            adb shell wm density 160
            adb install "$(find ci-artifacts -name app-x86_64-release.apk -print -quit)"
            adb install "$(find ci-artifacts -name app-release-androidTest.apk -print -quit)"
            curl -fL --retry 2 https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/9217f5db79a29953eb74d5343926648285ec7e67/qwen2.5-0.5b-instruct-q4_k_m.gguf -o "$RUNNER_TEMP/release-model.gguf"
            echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  $RUNNER_TEMP/release-model.gguf" | sha256sum -c -
            adb shell mkdir -p /sdcard/Android/data/cn.chronicle.shanhe/files
            adb push "$RUNNER_TEMP/release-model.gguf" /sdcard/Android/data/cn.chronicle.shanhe/files/qwen.gguf
            adb shell am start -W -n cn.chronicle.shanhe/cn.chronicle.game.MainActivity
            CHRONICLE_ONLINE_TEST=true bash scripts/run-device-tests.sh cn.chronicle.game.ReleaseSmokeTest "$RUNNER_TEMP/optimized-device-report"
            adb shell am force-stop cn.chronicle.shanhe
            CHRONICLE_ONLINE_TEST=true bash scripts/run-device-tests.sh cn.chronicle.game.ReleaseRestoreTest "$RUNNER_TEMP/optimized-device-report/restart"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: optimized-device-report
          path: ${{ runner.temp }}/optimized-device-report
