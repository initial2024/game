name: Android build and verification
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_model:
        description: Run the real GGUF inference, JSON and cancellation tests
        type: boolean
        default: true
      signed_apk:
        description: Build with the persistent private development signing identity
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  browser-map:
    if: ${{ !contains(github.event.head_commit.message, '[map-check]') && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/upgrade-map.py --check
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: CHROMIUM_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())") node scripts/export-terrain.cjs --check
      - run: CHROMIUM_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())") node scripts/test-map-browser.cjs --baseline
      - run: CHROMIUM_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())") node scripts/test-map-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-map-browser-report
          path: work/map-browser
  build:
    if: ${{ !contains(github.event.head_commit.message, '[map-check]') && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - run: ./gradlew :core:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automated-tests-and-development-apk
          path: |
            core/build/reports/tests
            core/build/test-results
            app/build/outputs/apk/debug
            app/build/outputs/apk/androidTest/debug
      - uses: actions/upload-artifact@v4
        with:
          name: chronicle-arm64-apk
          compression-level: 9
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chronicle-arm64-unsigned-release
          compression-level: 9
          path: app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
  android-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: automated-tests-and-development-apk
          path: ci-artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -feature -Vulkan
          script: |
            adb shell wm size 390x844
            adb shell wm density 160
            adb install -r ci-artifacts/app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb install -r ci-artifacts/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            CHRONICLE_ONLINE_TEST=true bash scripts/run-device-tests.sh cn.chronicle.game.HubLiveTest "$RUNNER_TEMP/android-ui-storage-report/huggingface"
            bash scripts/run-device-tests.sh cn.chronicle.game.CharacterFeatureTest "$RUNNER_TEMP/android-ui-storage-report/characters"
            bash scripts/run-device-tests.sh cn.chronicle.game.ScreenTest,cn.chronicle.game.StorageTest "$RUNNER_TEMP/android-ui-storage-report"
            adb shell am force-stop cn.chronicle.shanhe
            bash scripts/run-device-tests.sh cn.chronicle.game.MapIntegrationTest "$RUNNER_TEMP/android-ui-storage-report/map"
            adb shell am force-stop cn.chronicle.shanhe
            bash scripts/run-device-tests.sh cn.chronicle.game.MapRestartTest "$RUNNER_TEMP/android-ui-storage-report/restart"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-storage-report
          path: ${{ runner.temp }}/android-ui-storage-report
  native-model-test:
    if: (github.event_name == 'workflow_dispatch' && inputs.real_model) || contains(github.event.head_commit.message, '[full-model]')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: automated-tests-and-development-apk
          path: ci-artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -feature -Vulkan
          script: |
            adb shell wm size 390x844
            adb shell wm density 160
            adb install -r ci-artifacts/app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb install -r ci-artifacts/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            curl -fL --retry 2 https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/9217f5db79a29953eb74d5343926648285ec7e67/qwen2.5-0.5b-instruct-q4_k_m.gguf -o "$RUNNER_TEMP/chronicle-model.gguf"
            echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  $RUNNER_TEMP/chronicle-model.gguf" | sha256sum -c -
            adb shell mkdir -p /sdcard/Android/data/cn.chronicle.shanhe/files
            adb push "$RUNNER_TEMP/chronicle-model.gguf" /sdcard/Android/data/cn.chronicle.shanhe/files/qwen.gguf
            bash scripts/run-device-tests.sh cn.chronicle.game.RealModelTest "$RUNNER_TEMP/android-real-model-report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-real-model-report
          path: ${{ runner.temp }}/android-real-model-report
  signed-apk:
    if: github.event_name == 'workflow_dispatch' && inputs.signed_apk
    needs: build
    runs-on: ubuntu-latest
    env:
      CHRONICLE_KEYSTORE_BASE64: ${{ secrets.CHRONICLE_KEYSTORE_BASE64 }}
      CHRONICLE_STORE_PASSWORD: ${{ secrets.CHRONICLE_STORE_PASSWORD }}
      CHRONICLE_KEY_PASSWORD: ${{ secrets.CHRONICLE_KEY_PASSWORD }}
      CHRONICLE_KEYSTORE: ${{ github.workspace }}/private-signing.p12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Require persistent signing secrets
        shell: bash
        run: |
          test -n "$CHRONICLE_KEYSTORE_BASE64" || { echo 'Persistent signing key missing; refusing to replace identity.'; exit 1; }
          test -n "$CHRONICLE_STORE_PASSWORD"
          test -n "$CHRONICLE_KEY_PASSWORD"
          printf '%s' "$CHRONICLE_KEYSTORE_BASE64" | base64 -d > "$CHRONICLE_KEYSTORE"
          chmod 600 "$CHRONICLE_KEYSTORE"
      - run: ./gradlew :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: chronicle-arm64-signed-apk
          path: app/build/outputs/apk/release/*.apk
      - if: always()
        run: rm -f "$CHRONICLE_KEYSTORE"
