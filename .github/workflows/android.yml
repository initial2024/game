name: Android build and verification
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_model:
        description: Run the real GGUF inference, JSON and cancellation tests
        type: boolean
        default: true
      signed_apk:
        description: Build with the provisioned replacement private signing identity
        type: boolean
        default: false
concurrency:
  group: chronicle-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser-map:
    if: ${{ !contains(github.event.head_commit.message, '[map-check]') && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/upgrade-map.py --check
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: CHROMIUM_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())") node scripts/export-terrain.cjs --check
      - run: CHROMIUM_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())") node scripts/test-map-browser.cjs --baseline
      - run: CHROMIUM_PATH=$(node -e "process.stdout.write(require('playwright').chromium.executablePath())") node scripts/test-map-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-map-browser-report
          path: work/map-browser
  build:
    if: ${{ !contains(github.event.head_commit.message, '[map-check]') && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - run: ./gradlew :core:test :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automated-tests-and-development-apk
          path: |
            core/build/reports/tests
            core/build/test-results
            app/build/outputs/apk/debug
            app/build/outputs/apk/androidTest/debug
            app/build/outputs/mapping/release
      - uses: actions/upload-artifact@v4
        with:
          name: chronicle-arm64-apk
          compression-level: 9
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: chronicle-arm64-unsigned-release
          compression-level: 9
          path: app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk
  android-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: automated-tests-and-development-apk
          path: ci-artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -feature -Vulkan
          script: |
            adb shell wm size 390x844
            adb shell wm density 160
            adb install -r ci-artifacts/app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb install -r ci-artifacts/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            CHRONICLE_ONLINE_TEST=true bash scripts/run-device-tests.sh cn.chronicle.game.HubLiveTest "$RUNNER_TEMP/android-ui-storage-report/huggingface"
            bash scripts/run-device-tests.sh cn.chronicle.game.AutoLoadChatTest "$RUNNER_TEMP/android-ui-storage-report/auto-load"
            bash scripts/run-device-tests.sh cn.chronicle.game.CharacterFeatureTest "$RUNNER_TEMP/android-ui-storage-report/characters"
            bash scripts/run-device-tests.sh cn.chronicle.game.ScreenTest,cn.chronicle.game.StorageTest "$RUNNER_TEMP/android-ui-storage-report"
            adb shell am force-stop cn.chronicle.shanhe
            bash scripts/run-device-tests.sh cn.chronicle.game.MapIntegrationTest "$RUNNER_TEMP/android-ui-storage-report/map"
            adb shell am force-stop cn.chronicle.shanhe
            bash scripts/run-device-tests.sh cn.chronicle.game.MapRestartTest "$RUNNER_TEMP/android-ui-storage-report/restart"
            adb shell pm clear cn.chronicle.shanhe
            bash scripts/run-device-tests.sh cn.chronicle.game.ChronicleFeatureTest "$RUNNER_TEMP/android-ui-storage-report/chronicle"
            adb shell am force-stop cn.chronicle.shanhe
            adb shell pm clear cn.chronicle.shanhe
            bash scripts/run-device-tests.sh cn.chronicle.game.ChronicleClockUiTest "$RUNNER_TEMP/android-ui-storage-report/clock"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-storage-report
          path: ${{ runner.temp }}/android-ui-storage-report
  native-model-test:
    if: (github.event_name == 'workflow_dispatch' && inputs.real_model) || contains(github.event.head_commit.message, '[full-model]')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: automated-tests-and-development-apk
          path: ci-artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -feature -Vulkan
          script: |
            adb shell wm size 390x844
            adb shell wm density 160
            adb install -r ci-artifacts/app/build/outputs/apk/debug/app-x86_64-debug.apk
            adb install -r ci-artifacts/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            curl -fL --retry 2 https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/9217f5db79a29953eb74d5343926648285ec7e67/qwen2.5-0.5b-instruct-q4_k_m.gguf -o "$RUNNER_TEMP/chronicle-model.gguf"
            echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  $RUNNER_TEMP/chronicle-model.gguf" | sha256sum -c -
            adb shell mkdir -p /sdcard/Android/data/cn.chronicle.shanhe/files
            adb push "$RUNNER_TEMP/chronicle-model.gguf" /sdcard/Android/data/cn.chronicle.shanhe/files/qwen.gguf
            bash scripts/run-device-tests.sh cn.chronicle.game.RealModelTest "$RUNNER_TEMP/android-real-model-report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-real-model-report
          path: ${{ runner.temp }}/android-real-model-report
  signed-apk:
    # Do not sign untested source or forked PRs: all four upstream gates must pass.
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/feature/character-chat-hf-search' && contains(github.event.head_commit.message, '[release-0.8]')) || (github.event_name == 'workflow_dispatch' && inputs.signed_apk && github.ref == 'refs/heads/feature/character-chat-hf-search') }}
    needs: [build, browser-map, android-test, release-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CHRONICLE_KEYSTORE_BASE64: ${{ secrets.CHRONICLE_KEYSTORE_BASE64 }}
      CHRONICLE_STORE_PASSWORD: ${{ secrets.CHRONICLE_STORE_PASSWORD }}
      CHRONICLE_KEY_PASSWORD: ${{ secrets.CHRONICLE_KEY_PASSWORD }}
      CHRONICLE_KEYSTORE: ${{ github.workspace }}/private-signing.p12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Require provisioned private signing identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CHRONICLE_KEYSTORE_BASE64" || { echo 'BLOCKED_NO_PROVISIONED_PRIVATE_SIGNING_KEY'; exit 1; }
          test -n "$CHRONICLE_STORE_PASSWORD" || { echo 'BLOCKED_NO_PROVISIONED_STORE_PASSWORD'; exit 1; }
          test -n "$CHRONICLE_KEY_PASSWORD" || { echo 'BLOCKED_NO_PROVISIONED_KEY_PASSWORD'; exit 1; }
          printf '%s' "$CHRONICLE_KEYSTORE_BASE64" | base64 -d > "$CHRONICLE_KEYSTORE"
          chmod 600 "$CHRONICLE_KEYSTORE"
      - name: Build pinned-identity ARM64 release
        run: ./gradlew :app:assembleRelease
      - name: Verify certificate, package, version and ABI
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          test -s "$apk" || { echo 'BLOCKED_SIGNED_ARM64_NOT_FOUND'; exit 1; }
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" verify --verbose "$apk"
          cert="$("$signer" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          expected="0ed01577085333ba3d64c54f25304aaa4068e2b37b6f7c5d7aa2baf81a4d3b87"
          if [ "$cert" != "$expected" ]; then echo 'BLOCKED_SIGNING_CERTIFICATE_MISMATCH'; exit 1; fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/chronicle-badging.txt"
          grep -q "^package: name='cn.chronicle.shanhe' versionCode='13' versionName='0.8.0'" "$RUNNER_TEMP/chronicle-badging.txt" || { echo 'BLOCKED_RELEASE_VERSION_OR_PACKAGE_MISMATCH'; exit 1; }
          unzip -Z1 "$apk" > "$RUNNER_TEMP/chronicle-files.txt"
          grep -q '^lib/arm64-v8a/' "$RUNNER_TEMP/chronicle-files.txt" || { echo 'BLOCKED_MISSING_ARM64'; exit 1; }
          if grep -Eq '^lib/(x86_64|x86|armeabi-v7a)/' "$RUNNER_TEMP/chronicle-files.txt"; then echo 'BLOCKED_WRONG_ABI'; exit 1; fi
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$apk"
          sha256sum "$apk"
          echo "VERIFIED_RELEASE_CERT_SHA256=$cert"
          echo "VERIFIED_RELEASE_SOURCE_SHA=$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: chronicle-0.8.0-arm64-stable-signed
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          compression-level: 9
      - name: Publish verified ARM64 APK to apk-preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/character-chat-hf-search' && contains(github.event.head_commit.message, '[release-0.8]')
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-arm64-v8a-release.apk"
          worktree="$RUNNER_TEMP/chronicle-apk-preview"
          git fetch origin refs/heads/apk-preview:refs/remotes/origin/apk-preview
          git worktree add --detach "$worktree" refs/remotes/origin/apk-preview
          cp "$apk" "$worktree/chronicle-ai-0.8.0-arm64.apk"
          python3 - "$apk" "$worktree/chronicle-ai-0.8.0-build.json" <<'PY'
          import hashlib, json, os, pathlib, sys
          apk=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          out.write_text(json.dumps({
            "version":"0.8.0", "versionCode":13, "applicationId":"cn.chronicle.shanhe",
            "source_sha":os.environ["GITHUB_SHA"], "workflow_run_id":os.environ["GITHUB_RUN_ID"],
            "signed":True,
            "certificate_sha256":"0ed01577085333ba3d64c54f25304aaa4068e2b37b6f7c5d7aa2baf81a4d3b87",
            "apk_sha256":hashlib.sha256(apk.read_bytes()).hexdigest(),
            "apk_bytes":apk.stat().st_size
          },indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          PY
          git -C "$worktree" config user.name "github-actions[bot]"
          git -C "$worktree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$worktree" add chronicle-ai-0.8.0-arm64.apk chronicle-ai-0.8.0-build.json
          git -C "$worktree" diff --cached --quiet || git -C "$worktree" commit -m "release: verified Chronicle AI 0.8.0 ARM64 $GITHUB_SHA"
          git -C "$worktree" push origin HEAD:refs/heads/apk-preview
          echo 'PUBLISHED=chronicle-ai-0.8.0-arm64.apk'
      - if: always()
        run: rm -f "$CHRONICLE_KEYSTORE"

  release-smoke:
    if: ${{ !contains(github.event.head_commit.message, '[map-check]') && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - run: ./gradlew -Pchronicle.testRelease=true :app:assembleRelease :app:assembleReleaseAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -feature -Vulkan
          script: |
            adb shell wm size 390x844
            adb shell wm density 160
            adb install app/build/outputs/apk/release/app-x86_64-release.apk
            adb install app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            curl -fL --retry 2 https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/9217f5db79a29953eb74d5343926648285ec7e67/qwen2.5-0.5b-instruct-q4_k_m.gguf -o "$RUNNER_TEMP/release-model.gguf"
            echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  $RUNNER_TEMP/release-model.gguf" | sha256sum -c -
            adb shell mkdir -p /sdcard/Android/data/cn.chronicle.shanhe/files
            adb push "$RUNNER_TEMP/release-model.gguf" /sdcard/Android/data/cn.chronicle.shanhe/files/qwen.gguf
            adb shell am start -W -n cn.chronicle.shanhe/cn.chronicle.game.MainActivity
            CHRONICLE_ONLINE_TEST=true bash scripts/run-device-tests.sh cn.chronicle.game.ReleaseSmokeTest "$RUNNER_TEMP/release-smoke-report"
            adb shell am force-stop cn.chronicle.shanhe
            CHRONICLE_ONLINE_TEST=true bash scripts/run-device-tests.sh cn.chronicle.game.ReleaseRestoreTest "$RUNNER_TEMP/release-smoke-report/restart"
            adb pull /sdcard/Pictures/ChronicleCI "$RUNNER_TEMP/release-smoke-report/screenshots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-smoke-report-and-mapping
          path: |
            ${{ runner.temp }}/release-smoke-report
            app/build/outputs/mapping/release
            app/build/outputs/apk/release
            app/build/outputs/apk/androidTest/release
